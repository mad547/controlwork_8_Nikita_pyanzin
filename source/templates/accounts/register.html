{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="forum-card form-card-lg my-5">
    <div class="forum-card-header text-center">Регистрация</div>
    <div class="p-4">
        <form method="POST" action="" enctype="multipart/form-data">
            {% csrf_token %}
            {% bootstrap_form form layout="floating" %}
            <button type="submit" class="btn-forum w-100 mt-3">Зарегистрироваться</button>
        </form>
    </div>
    <div class="forum-card-footer text-center">
        Уже есть аккаунт? <a href="{% url 'accounts:login' %}" class="author-link">Войдите</a>
    </div>
</div>
{% endblock %}
