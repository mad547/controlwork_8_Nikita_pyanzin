{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Forum</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-forum navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'threads:index' %}">💬 Forum</a>
        <div class="d-flex align-items-center gap-3">
            <form method="GET" action="{% url 'threads:index' %}" class="d-flex gap-2">
                <input type="text" name="query" class="input-forum"
                       placeholder="Поиск..." value="{{ request.GET.query }}">
                <button type="submit" class="btn-forum">Поиск</button>
            </form>
            {% if request.user.is_authenticated %}
                <a href="{% url 'threads:thread_create' %}" class="btn-forum">Создать тему</a>
                <a href="{% url 'accounts:profile' request.user.pk %}" class="btn-forum-outline">Кабинет</a>
                <form method="POST" action="{% url 'accounts:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn-forum-danger">Выход</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn-forum">Вход</a>
                <a href="{% url 'accounts:register' %}" class="btn-forum-outline">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}
    {% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
